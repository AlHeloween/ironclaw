[package]
name = "firecrawl-search-service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_jsonc = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
walkdir = "2"
notify = "6"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
