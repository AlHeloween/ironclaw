[package]
name = "universal-search-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Universal search service: local code search, web search, and code search aggregation"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"

[lib]
name = "universal_search_service"
path = "src/lib.rs"

[[bin]]
name = "universal-search-service"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
actix-web = "4"
actix-rt = "2"
reqwest = { version = "0.11", features = ["json", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jsonc = "1"

# File system
walkdir = "2"
notify = "6"
dirs = "5"

# Configuration
dotenvy = "0.15"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["tlhelp32", "processthreadsapi", "handleapi", "errhandlingapi", "winnt", "minwindef", "shellapi", "winuser", "debugapi"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
tempfile = "3"
mockito = "1"
